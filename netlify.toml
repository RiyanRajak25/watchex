[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_RECAPTCHA_SITE_KEY,NEXT_PUBLIC_TURNSTILE_SITE_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions."pSEO-worker-background"]
  schedule = "*/15 * * * *"
